services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance_dev
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - attendance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_dev -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  attendance_db:
