services:
  - type: web
    name: campus-attendance-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-attendance-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: campus-attendance-db
    plan: free
