services:
  - type: web
    name: campus-attendance-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-attendance-db
          property: connectionString

databases:
  - name: campus-attendance-db
    plan: free
